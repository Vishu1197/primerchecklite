[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "primerchecklite"
version = "0.2.0"
description = "Beginner-friendly PCR and qRT-PCR primer screening"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "biopython>=1.81",
  "primer3-py>=2.0.0",
  "typer>=0.9",
  "rich>=13.0"
]

[project.optional-dependencies]
ui = ["streamlit>=1.32", "pandas>=2.0"]
dev = ["pytest>=7.4", "ruff>=0.3"]

[project.scripts]
primerchecklite = "primerchecklite.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
